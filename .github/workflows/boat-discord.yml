name: boat-discord
on:
  schedule:
    - cron: "15 23 * * *"
    - cron: "*/10 23 * * *"
    - cron: "*/10 0-14 * * *"
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: morning list at 08:15 JST
        if: github.event.schedule == '15 23 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 boat_discord.py morning
      - name: ten minutes before deadline
        if: github.event_name == 'schedule' && github.event.schedule != '15 23 * * *'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 boat_discord.py before
